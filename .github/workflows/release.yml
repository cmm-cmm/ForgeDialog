name: Release

concurrency:
  group: release-main
  cancel-in-progress: false

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm trusted publishing: npm exchanges this token for a
  # short-lived credential, so no NPM_TOKEN secret is needed.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs a recent npm; the version bundled with Node
      # varies by patch release, so pin it here rather than inherit it.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - name: Verify the release is publishable
        run: npm run check:release
      - run: npx playwright install --with-deps
      - run: npm run validate:all
      - run: npm sbom --sbom-format cyclonedx > forgedialog-sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forgedialog-sbom
          path: forgedialog-sbom.json

      # The core first: the wrapper packages depend on it, so a consumer who
      # installs one of them the moment it appears must find the core already
      # there. `--workspaces` publishes forgedialog-react and forgedialog-vue,
      # each of which needs its own trusted publisher entry on npmjs.com.
      - name: Publish to npm with OIDC
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        run: |
          npm publish
          npm publish --workspaces
      - name: Skip npm publishing until trusted publishing is enabled
        if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: |
          echo "NPM_PUBLISH_ENABLED is not 'true', so nothing was published."
          echo "See docs/releasing.md for the one-time npm setup."
