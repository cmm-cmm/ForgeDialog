<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForgeDialog Demo</title>
    <link rel="stylesheet" href="../dist/index.css" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 40px 24px 80px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        max-width: 720px;
        margin-inline: auto;
        color: #1a1d23;
        background: #f7f8fa;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f2f3f5;
          background: #14161b;
        }
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 4px;
      }
      p.lead {
        color: #5b6270;
        margin-top: 0;
      }
      .demo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
        margin: 24px 0;
      }
      .demo-btn {
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid #d6d9e0;
        background: white;
        cursor: pointer;
        font-size: 0.95rem;
      }
      .demo-btn:hover {
        background: #eceef2;
      }
      @media (prefers-color-scheme: dark) {
        .demo-btn {
          background: #1f2229;
          border-color: #33363f;
          color: #f2f3f5;
        }
        .demo-btn:hover {
          background: #2b2e37;
        }
      }
      .theme-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 24px;
      }
      .appearance-builder {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        padding: 16px;
        margin: 24px 0;
        border: 1px solid #d6d9e0;
        border-radius: 12px;
      }
      .appearance-builder label {
        display: grid;
        gap: 6px;
        font-size: 0.85rem;
      }
      .appearance-builder .wide {
        grid-column: 1 / -1;
      }
      #log {
        background: #11131a;
        color: #d7f9d0;
        padding: 16px;
        border-radius: 8px;
        min-height: 120px;
        max-height: 320px;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>ForgeDialog Demo</h1>
    <p class="lead">Manual verification page for alert / confirm / prompt / open() and stacking.</p>

    <div class="theme-row">
      <strong>Theme:</strong>
      <button class="demo-btn" data-theme="light">Light</button>
      <button class="demo-btn" data-theme="dark">Dark</button>
      <button class="demo-btn" data-theme="system">System</button>
    </div>

    <fieldset class="appearance-builder">
      <legend>Appearance &amp; drag builder</legend>
      <label
        >Surface opacity
        <input id="appearance-opacity" type="range" min="0.2" max="1" step="0.05" value="0.9"
      /></label>
      <label
        >Overlay opacity
        <input id="appearance-overlay" type="range" min="0" max="1" step="0.05" value="0.65"
      /></label>
      <label
        >Backdrop blur
        <input id="appearance-blur" type="range" min="0" max="30" step="1" value="10"
      /></label>
      <label
        >Border width
        <input id="appearance-border-width" type="range" min="0" max="8" step="1" value="2"
      /></label>
      <label
        >Border color <input id="appearance-border-color" type="color" value="#7c5cff"
      /></label>
      <label
        >Border opacity
        <input id="appearance-border-opacity" type="range" min="0" max="1" step="0.05" value="1"
      /></label>
      <label
        >Surface color <input id="appearance-surface-color" type="color" value="#ffffff"
      /></label>
      <label
        >Corner radius
        <input id="appearance-radius" type="range" min="0" max="40" step="2" value="10"
      /></label>
      <label
        >Top-left radius
        <input id="appearance-radius-tl" type="range" min="0" max="60" step="2" value="10"
      /></label>
      <label
        >Title background <input id="appearance-title-bg" type="color" value="#f2f3f5"
      /></label>
      <label>Use title background <input id="appearance-title-bg-on" type="checkbox" /></label>
      <label>Title color <input id="appearance-title-color" type="color" value="#1a1d23" /></label>
      <label
        >Title opacity
        <input id="appearance-title-opacity" type="range" min="0" max="1" step="0.05" value="1"
      /></label>
      <label
        >Content color <input id="appearance-content-color" type="color" value="#5b6270"
      /></label>
      <label
        >Content opacity
        <input id="appearance-content-opacity" type="range" min="0" max="1" step="0.05" value="1"
      /></label>
      <label
        >Shadow angle (deg)
        <input id="appearance-shadow-angle" type="range" min="0" max="360" step="15" value="180"
      /></label>
      <label
        >Shadow distance
        <input id="appearance-shadow-distance" type="range" min="0" max="60" step="2" value="20"
      /></label>
      <label
        >Shadow blur
        <input id="appearance-shadow-blur" type="range" min="0" max="120" step="5" value="60"
      /></label>
      <label
        >Shadow strength
        <input id="appearance-shadow-opacity" type="range" min="0" max="1" step="0.05" value="0.25"
      /></label>
      <label
        >Shadow color <input id="appearance-shadow-color" type="color" value="#0f1115"
      /></label>
      <label>Hover effect <input id="appearance-hover" type="checkbox" checked /></label>
      <label
        >Hover border color <input id="appearance-hover-border" type="color" value="#ff9f1c"
      /></label>
      <label
        >Hover title color <input id="appearance-hover-title" type="color" value="#ff9f1c"
      /></label>
      <label
        >Hover lift
        <input id="appearance-hover-lift" type="range" min="0" max="24" step="2" value="8"
      /></label>
      <label
        >Hover scale
        <input id="appearance-hover-scale" type="range" min="1" max="1.1" step="0.01" value="1.02"
      /></label>
      <button class="demo-btn wide" id="btn-appearance">Open interactive preview</button>
    </fieldset>
    <div class="theme-row">
      <strong>Preset:</strong>
      <button class="demo-btn" data-preset="default">Default</button>
      <button class="demo-btn" data-preset="minimal">Minimal</button>
      <button class="demo-btn" data-preset="glass">Glass</button>
      <button class="demo-btn" data-preset="material">Material</button>
    </div>

    <div class="demo-grid">
      <button class="demo-btn" id="btn-alert">Show Alert</button>
      <button class="demo-btn" id="btn-confirm">Show Confirm</button>
      <button class="demo-btn" id="btn-prompt">Show Prompt</button>
      <button class="demo-btn" id="btn-prompt-validate">Prompt with validation</button>
      <button class="demo-btn" id="btn-custom">Custom open()</button>
      <button class="demo-btn" id="btn-stacked">Two Stacked Dialogs</button>
      <button class="demo-btn" id="btn-no-animation">Alert (no animation)</button>
      <button class="demo-btn" id="btn-slide">Confirm (slide animation)</button>
      <button class="demo-btn" id="btn-drawer">Open Drawer</button>
      <button class="demo-btn" id="btn-sheet">Bottom Sheet</button>
      <button class="demo-btn" id="btn-toast">Success Toast</button>
      <button class="demo-btn" id="btn-commands">Command Palette</button>
      <button class="demo-btn" id="btn-wizard">Typed Wizard</button>
    </div>

    <strong>Result log</strong>
    <pre id="log"></pre>

    <script src="../dist/index.global.js"></script>
    <script>
      const {
        alert,
        confirm,
        prompt,
        open,
        setTheme,
        setThemePreset,
        registerPlugin,
        drawer,
        bottomSheet,
        toast,
        commandPalette,
        wizard,
      } = ForgeDialog;
      const log = document.getElementById('log');

      function print(label, value) {
        const line = `[${new Date().toLocaleTimeString()}] ${label}: ${JSON.stringify(value)}\n`;
        log.textContent = line + log.textContent;
      }

      registerPlugin({
        name: 'demo-logger',
        hooks: {
          afterOpen: (ctx) => print('hook:afterOpen', ctx.instance.id),
          afterClose: (ctx) => print('hook:afterClose', ctx.instance.id),
        },
      });

      document.querySelectorAll('[data-theme]').forEach((btn) => {
        btn.addEventListener('click', () => setTheme(btn.dataset.theme));
      });
      document.querySelectorAll('[data-preset]').forEach((btn) => {
        btn.addEventListener('click', () => setThemePreset(btn.dataset.preset));
      });

      const value = (id) => document.getElementById(id).value;
      const checked = (id) => document.getElementById(id).checked;
      const currentAppearance = () => ({
        opacity: Number(value('appearance-opacity')),
        overlayOpacity: Number(value('appearance-overlay')),
        backdropBlur: Number(value('appearance-blur')),
        surfaceColor: value('appearance-surface-color'),
        radius: {
          topLeft: Number(value('appearance-radius-tl')),
          topRight: Number(value('appearance-radius')),
          bottomRight: Number(value('appearance-radius')),
          bottomLeft: Number(value('appearance-radius')),
        },
        titleBackground: checked('appearance-title-bg-on')
          ? value('appearance-title-bg')
          : undefined,
        titleColor: value('appearance-title-color'),
        titleOpacity: Number(value('appearance-title-opacity')),
        contentColor: value('appearance-content-color'),
        contentOpacity: Number(value('appearance-content-opacity')),
        borderWidth: Number(value('appearance-border-width')),
        borderColor: value('appearance-border-color'),
        borderOpacity: Number(value('appearance-border-opacity')),
        shadow: {
          angle: Number(value('appearance-shadow-angle')),
          distance: Number(value('appearance-shadow-distance')),
          blur: Number(value('appearance-shadow-blur')),
          color: value('appearance-shadow-color'),
          opacity: Number(value('appearance-shadow-opacity')),
        },
        hover: checked('appearance-hover')
          ? {
              borderColor: value('appearance-hover-border'),
              titleColor: value('appearance-hover-title'),
              lift: Number(value('appearance-hover-lift')),
              scale: Number(value('appearance-hover-scale')),
              shadow: 'xl',
            }
          : undefined,
      });
      let appearancePreview;
      document
        .querySelectorAll('.appearance-builder input, .appearance-builder select')
        .forEach((control) => {
          control.addEventListener('input', () =>
            appearancePreview?.update({ appearance: currentAppearance() }),
          );
        });

      document.getElementById('btn-appearance').addEventListener('click', () => {
        const instance = open({
          title: 'Interactive appearance preview',
          message:
            'Drag this dialog by its header. Focus the header and use arrow keys for precise movement.',
          appearance: currentAppearance(),
          draggable: {
            bounds: 'viewport',
            persistKey: 'appearance-demo',
            keyboardStep: 8,
            onDragEnd: ({ position }) => print('dialog position', position),
          },
          buttons: [
            {
              text: 'Reset position',
              role: 'secondary',
              closesDialog: false,
              onClick: (dialog) => dialog.resetPosition(),
            },
            { text: 'Done', role: 'primary', closesDialog: true },
          ],
        });
        appearancePreview = instance;
        instance.whenSettled().then((outcome) => {
          appearancePreview = undefined;
          print('appearance preview', outcome);
        });
      });

      document.getElementById('btn-alert').addEventListener('click', async () => {
        await alert('This is an alert dialog.', { title: 'Heads up' });
        print('alert()', 'closed');
      });

      document.getElementById('btn-confirm').addEventListener('click', async () => {
        const result = await confirm('Are you sure you want to continue?', {
          title: 'Please confirm',
        });
        print('confirm()', result);
      });

      document.getElementById('btn-prompt').addEventListener('click', async () => {
        const result = await prompt('What is your name?', {
          title: 'Introduce yourself',
          defaultValue: 'Ada Lovelace',
        });
        print('prompt()', result);
      });

      document.getElementById('btn-prompt-validate').addEventListener('click', async () => {
        const result = await prompt('Enter an even number:', {
          title: 'Validated prompt',
          validate: (value) => {
            const n = Number(value);
            if (Number.isNaN(n)) return 'Please enter a number';
            if (n % 2 !== 0) return 'Number must be even';
            return true;
          },
        });
        print('prompt() validated', result);
      });

      document.getElementById('btn-custom').addEventListener('click', () => {
        const instance = open({
          title: 'Custom dialog',
          content: (container) => {
            const p = document.createElement('p');
            p.textContent = 'This dialog was built with the generic open() API.';
            container.appendChild(p);
          },
          buttons: [
            { text: 'Close', role: 'primary', autoFocus: true, onClick: (i) => i.close('done') },
          ],
        });
        instance.whenClosed().then((result) => print('open()', result));
      });

      document.getElementById('btn-stacked').addEventListener('click', async () => {
        const first = confirm('First dialog. Open a second one on top?', { title: 'Dialog 1' });
        const second = await confirm('This is stacked above the first dialog.', {
          title: 'Dialog 2',
        });
        print('stacked: second result', second);
        const firstResult = await first;
        print('stacked: first result', firstResult);
      });

      document.getElementById('btn-no-animation').addEventListener('click', async () => {
        await alert('This alert opens/closes instantly.', { animation: 'none' });
        print('alert() no animation', 'closed');
      });

      document.getElementById('btn-slide').addEventListener('click', async () => {
        const result = await confirm('This dialog slides in from below.', { animation: 'slide' });
        print('confirm() slide', result);
      });

      document.getElementById('btn-drawer').addEventListener('click', () =>
        drawer({
          title: 'Project settings',
          message: 'A native, focus-safe right drawer.',
          buttons: [{ text: 'Done', role: 'primary', closesDialog: true }],
        }),
      );
      document.getElementById('btn-sheet').addEventListener('click', () =>
        bottomSheet({
          title: 'Quick actions',
          message: 'Drag down to dismiss this mobile sheet.',
          buttons: [{ text: 'Done', role: 'primary', closesDialog: true }],
        }),
      );
      document
        .getElementById('btn-toast')
        .addEventListener('click', () => toast('Changes saved successfully.', { tone: 'success' }));
      document.getElementById('btn-commands').addEventListener('click', () =>
        commandPalette([
          {
            id: 'theme-dark',
            label: 'Switch to dark theme',
            keywords: ['appearance'],
            run: () => setTheme('dark'),
          },
          {
            id: 'theme-light',
            label: 'Switch to light theme',
            keywords: ['appearance'],
            run: () => setTheme('light'),
          },
        ]),
      );
      document.getElementById('btn-wizard').addEventListener('click', async () => {
        const flow = wizard({
          initialData: { name: '' },
          steps: [
            {
              id: 'profile',
              title: 'Your profile',
              render: (el, ctx) => {
                const input = document.createElement('input');
                input.className = 'fd-input';
                input.placeholder = 'Name';
                input.addEventListener('input', () => ctx.set({ name: input.value }));
                el.append(input);
              },
              validate: (ctx) => (ctx.data.name ? true : 'Please enter your name.'),
            },
            {
              id: 'review',
              title: 'Review',
              render: (el, ctx) => {
                el.textContent = `Ready to welcome ${ctx.data.name}.`;
              },
            },
          ],
        });
        print('wizard()', await flow.result);
      });
    </script>
  </body>
</html>
