<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Forge Dialog">
  <title>Forge Dialog</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5468e8" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Backdrop: the page the dialog sits over. -->
  <rect id="ground" width="64" height="64" rx="15" fill="url(#bg)" />

  <!-- The layer underneath, hinting at the stack a modal creates. -->
  <rect x="13" y="13" width="38" height="30" rx="7" fill="#ffffff" opacity="0.3" />

  <!-- The dialog itself. -->
  <rect x="16" y="20" width="36" height="28" rx="7" fill="#ffffff" />

  <!-- Title bar, rounded only where it meets the dialog's top corners. -->
  <path d="M16 30V27a7 7 0 0 1 7-7h22a7 7 0 0 1 7 7v3z" fill="#ff9f1c" />

  <!-- Content lines. -->
  <rect x="22" y="36" width="24" height="3.2" rx="1.6" fill="#c6cbd8" />
  <rect x="22" y="41.5" width="15" height="3.2" rx="1.6" fill="#c6cbd8" />
</svg>
